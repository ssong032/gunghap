<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: linear-gradient(135deg, #fff1ea 0%, #fde3ea 55%, #f6dcef 100%); color: #2b2230; position: relative; }
  .wrap { position: absolute; inset: 0; padding: 70px 80px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .logo { font-size: 44px; font-weight: 900; letter-spacing: -1px; }
  .logo span { color: #e8577a; }
  h1 { font-size: 66px; line-height: 1.15; margin: 0; font-weight: 900; letter-spacing: -2px; }
  h1 em { font-style: normal; color: #e8577a; }
  .chips { display: flex; gap: 14px; flex-wrap: wrap; }
  .chips span { background: #fff; border-radius: 999px; padding: 12px 26px; font-size: 30px; font-weight: 700; box-shadow: 0 6px 18px rgba(232, 87, 122, .15); }
  .free { font-size: 30px; color: #7a6d80; font-weight: 700; }
  .zodiac { position: absolute; right: 50px; top: 90px; display: grid; grid-template-columns: repeat(3, 70px); gap: 22px 10px; font-size: 56px; line-height: 1; text-align: center; font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif; }
</style></head>
<body>
  <div class="zodiac"><span>🐭</span><span>🐮</span><span>🐯</span><span>🐰</span><span>🐲</span><span>🐍</span><span>🐴</span><span>🐑</span><span>🐵</span><span>🐔</span><span>🐶</span><span>🐷</span></div>
  <div class="wrap">
    <div class="logo">찰떡<span>궁합</span></div>
    <h1>2027 신년운세<br><em>띠별 순위</em> · 오늘의 사주</h1>
    <div class="chips"><span>💗 연애운</span><span>💼 취업운</span><span>💰 금전운</span><span>🌿 건강운</span></div>
    <div class="free">생년월일만 넣으면 무료 · 회원가입 없음</div>
  </div>
</body></html>
